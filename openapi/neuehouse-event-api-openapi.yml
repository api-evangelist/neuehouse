      operationId: get_wp_v2_event
      summary: GET /wp/v2/event
      description: '`GET /wp/v2/event` as declared by the NeueHouse WordPress REST route index at https://www.neuehouse.com/wp-json/. Argument names, defaults, enums and required flags below are copied verbatim from that index.'
