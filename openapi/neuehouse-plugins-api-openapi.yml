      operationId: post_wp_v2_plugins
      summary: POST /wp/v2/plugins
      description: '`POST /wp/v2/plugins` as declared by the NeueHouse WordPress REST route index at https://www.neuehouse.com/wp-json/. Argument names, defaults, enums and required flags below are copied verbatim from that index.'
      tags:
