  version: wp/v2
  description: 'The public content API NeueHouse serves from its own host at https://www.neuehouse.com/wp-json/.
    NeueHouse runs its site on WordPress, and the WordPress REST API is exposed and answering anonymously:
    the route index at /wp-json/ is a live, machine-readable contract declaring 313 routes across 16 namespaces,
    of which the wp/v2 and oembed/1.0 namespaces below are the publicly readable content surface (pages,
    media, taxonomies, block types, search, oEmbed). Read operations on published content are anonymous;
    every write operation requires an authenticated WordPress user, so the write half of this contract
    is documented but not open. This document was mechanically derived from the provider''s own live route
    index — argument names, types, enums, defaults and required flags are copied from it verbatim. NeueHouse
    does not publish an OpenAPI definition itself.'
