apis:
- name: NeueHouse Content API
  description: The public content API NeueHouse serves from its own host at https://www.neuehouse.com/wp-json/.
    NeueHouse runs on WordPress and the WordPress REST API is exposed and answering anonymously; the route
    index is a live machine-readable contract declaring 313 routes across 16 namespaces. The wp/v2 and
    oembed/1.0 namespaces are the publicly readable surface and include four NeueHouse-specific types
    — event (467 items), press (66), location (3) and neuejournal (0) — plus pages, media (9,144), categories,
    search and oEmbed. Reads of published content require no key and no signup. Every write route requires
    a WordPress Application Password issued only from wp-admin, so there is no third-party write access.
    NeueHouse publishes no OpenAPI; the definition linked here was mechanically derived by API Evangelist
    from the provider's own live route index.
  humanURL: https://www.neuehouse.com/
  baseURL: https://www.neuehouse.com/wp-json
