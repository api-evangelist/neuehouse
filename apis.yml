aid: neuehouse
name: NeueHouse
description: 'NeueHouse is a private work and cultural home for creatives — a members-only workspace,
  screening room, podcast studio and events club founded in New York in 2011. It is a hospitality brand
  rather than a software company and it runs no developer program, publishes no API documentation and
  issues no API credentials. It does, however, serve a live, anonymous, machine-readable content API from
  its own host: the site runs on WordPress and its WordPress REST API is exposed at https://www.neuehouse.com/wp-json/,
  where the route index declares 313 routes across 16 namespaces. Alongside the WordPress defaults the
  deployment registers four NeueHouse-specific content types that read anonymously — event (467 records
  of cultural programming), press (66), location (3 houses) and neuejournal (empty) — making the events
  and press archives genuinely useful to an outside consumer. NeueHouse ceased operations in September
  2025 and filed Chapter 7; Convene Hospitality Group acquired the brand, intellectual property and the
  Madison Square flagship out of bankruptcy and relaunched the brand in January 2026. The Los Angeles
  houses were not acquired and are not reopening, although their records are still served by the content
  API.'
