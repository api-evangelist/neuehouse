summary: >-
  NeueHouse makes no compliance or standards claims anywhere on its public surface — there is no
  trust page, no certifications page, and no developer documentation in which a claim could be made.
  Every entry below is derived from what the live contract demonstrably does or does not implement.
  Domain-standard conformance is not applicable: private members clubs / hospitality have no
  machine-readable domain standard for this pipeline to test, and none is invented.
standards:
